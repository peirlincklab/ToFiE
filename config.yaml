path: "/path/to/ToFiE/"   # absolute path to this folder
path_to_dir: "images/"    # input images, relative to path
path_to_output: "outputs/"  # outputs, relative to path
remote_dir: "/scratch/<username>/ToFiE/outputs"  # HPC only: working directory for step 2
image: "example_image.tif"

# image processing
pixel_spacing: [0.11, 0.11, 0.11]  # z, x, y (um)
std: 2.5          # gaussian blur sigma (pixels)
truncate: 0.1     # blur kernel cutoff (in sigmas)
upper: 0.999995   # z-correction percentile
lower: 0          # z-correction minimum intensity
iter: 4           # Richardson-Lucy iterations

# DisPerSE
persistence_val: 20  # mse -cut
smooth_val: 100      # skelconv -smooth
assemble_val: 30     # skelconv -assemble
trimBelow_val: 10    # skelconv -trimBelow
nthreads_val: 8      # threads for mse

# skeleton refinement
angle_threshold: 1.0472  # rad
length_threshold: 0.4    # um
remove_broken_ends: False
remove_dangling_ends: False